# Task 4 - pytest configuration for our test suites (sqe_tests only).
# The original TinyDB tests in ../tests keep using the root pytest.ini.
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -v                         : show every test name and result
# --order-group-scope=module : order whole files (groups) first, then tests inside each file
# --strict-markers           : fail if a marker is used that is not registered below
addopts = -v --order-group-scope=module --strict-markers -p no:cacheprovider

# Test groups / suites. Run one with:  pytest sqe_tests -m <name>
markers =
    storage: Module 2 - Storage and Middleware tests (Muhammad Anees)
    table: Module 3 - Table tests (Abdullah Jamal)
    queries: Module 1 - Query tests (Muhammad Anees)
    data_driven: tests that read their data from CSV files in sqe_tests/data
    smoke: small set of critical tests for a quick health check
    negative: tests that check invalid input raises the correct error
